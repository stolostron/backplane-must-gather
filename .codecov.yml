# Codecov configuration
# https://docs.codecov.com/docs/codecov-yaml
#
# NOTE: this repository does not currently contain an executable test suite.
# It holds generated bundle/catalog artifacts, release orchestration tooling, or
# shell collection scripts rather than application code, so there is nothing to
# measure today.
#
# This file is intentionally present so the coverage signal is explicit and the
# configuration is ready for the first real tests. Both status checks are
# `informational`, so they report but never block a pull request. When a genuine
# test suite lands, remove `informational: true` and set real targets.

coverage:
  precision: 2
  round: down
  range: "60...100"

  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true
